[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sprocket-py"
version = "0.1.0"
description = "Python bindings for Sprocket's WDL parsing and linting tooling"
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"
keywords = ["wdl", "bioinformatics", "sprocket", "workflow"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/ambfr/sprocket-py"
Repository = "https://github.com/ambfr/sprocket-py"

[tool.maturin]
features = ["pyo3/extension-module"]